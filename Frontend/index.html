<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotkeyHive</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 0;
          background-color: #f4f4f4;
      }

      #menu {
          background-color: #333;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
      }

      #menu button {
          background-color: #444;
          color: white;
          border: none;
          padding: 10px 20px;
          cursor: pointer;
          border-radius: 5px;
          font-size: 16px;
      }

      #menu button:hover {
          background-color: #555;
      }

      #content {
          text-align: center; /* Center text within the div */
          padding: 20px;
          background-color: #fff; /* Optional: Add a background color for visibility */
          border-radius: 10px; /* Optional: Rounded corners */
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Optional: Add a shadow */
      }

      h2 {
          color: #333;
      }

      /* .form-group {
          margin-bottom: 15px;
      } */

      label {
          display: block;
          margin-top: 10px;
          font-weight: bold;
      }

      input, select, button {
          padding: 10px;
          width: 100%;
          max-width: 400px;
          margin-top: 5px;
          margin-bottom: 15px;
          font-size: 16px;
          border: 1px solid #ccc;
          border-radius: 5px;
      }

      button {
          background-color: #007BFF;
          color: white;
          cursor: pointer;
      }

      button:hover {
          background-color: #218838;
      }


      #remappings-table {
        width: 100%; /* Ensure the table spans the container */
        border-collapse: collapse; /* Avoid spacing between table cells */
        margin-top: 20px; /* Add some space above the table */
      }

      #remappings-table th, #remappings-table td {
        border: 1px solid #ccc; /* Add borders for clarity */
        padding: 10px; /* Add padding inside cells */
        text-align: center; /* Align text to the left */
      }

      #remappings-table th {
        background-color: #f4f4f4; /* Light gray background for headers */
        font-weight: bold; /* Make headers bold */
      }

      #remappings-table tbody tr:hover {
        background-color: #f0f8ff; /* Highlight the row on hover */
      }

      #remappings-container {
        margin-top: 20px;
        max-height: 300px; /* Add a max height with scrolling */
        overflow-y: auto;
      }

  </style>
</head>
<body>
    <!-- <h1>Welcome to HotkeyHive</h1>
    <p>This is my first Electron app!</p> -->

    <div id="menu">
        <button id="view-remappings">View Remappings</button>
        <button id="add-remapping">Add Remapping</button>
        <button id="delete-remapping">Delete Remappings</button>
        <button id="hook" style="background-color: red;">Start Hook</button>
    </div>

    <div id="content">
        <h2>Welcome to Hotkey Hive</h2>
        <p>Click a button above to begin managing your key remappings.</p>

    <script src="renderer.js"></script>
</body>
</html>
